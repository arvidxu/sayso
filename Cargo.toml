[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
audio = { path = "crates/audio" }
configuration = { path = "crates/configuration" }
dictation-api = { path = "crates/dictation-api" }
dictation-types = { path = "crates/dictation-types" }
extension = { path = "crates/extension" }
model-store = { path = "crates/model-store" }

# Release builds are optimised for a small binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
